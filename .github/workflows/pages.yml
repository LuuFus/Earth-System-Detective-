# Builds the site and publishes it to the gh-pages branch, which GitHub Pages serves at
# https://<owner>.github.io/<repository>/. Runs on every push to main, on demand, and every hour
# to refresh the live data (weather forecast from NOAA GFS, fires from NASA FIRMS): those servers
# do not answer browsers on other sites, so the data is fetched here and published as files.
# Note: GitHub pauses scheduled runs in a repository with no activity for 60 days.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Live data (weather, fires)
        run: |
          pip install --quiet numpy
          python data-pipeline/build_live.py

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Free token from https://aqicn.org/data-platform/token/ saved as a repository secret.
          VITE_WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
        run: |
          npm run build
          # Pages has no server-side routing: serve the app for /explore and any other path.
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Publish to gh-pages
        working-directory: frontend/dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
